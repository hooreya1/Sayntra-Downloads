<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <title>Sayntra — 비공개 홈페이지</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070a18;
        color: #f7f8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 10%, rgba(57, 189, 255, 0.16), transparent 30rem),
          radial-gradient(circle at 82% 75%, rgba(111, 75, 255, 0.16), transparent 28rem),
          #070a18;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.35;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }

      main {
        position: relative;
        width: min(100%, 560px);
        padding: clamp(32px, 7vw, 56px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        text-align: center;
        background: rgba(12, 16, 38, 0.74);
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.44),
          inset 0 1px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
      }

      .mark {
        width: 76px;
        height: 76px;
        margin: 0 auto 26px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        background: linear-gradient(145deg, #72e5ff 0%, #327dff 48%, #7b45ff 100%);
        box-shadow: 0 16px 42px rgba(73, 116, 255, 0.38);
      }

      .mark svg {
        width: 40px;
        height: 40px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #8adfff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 46px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      p {
        margin: 18px auto 0;
        max-width: 410px;
        color: #b9bfd4;
        font-size: 16px;
        line-height: 1.75;
        word-break: keep-all;
      }

      a {
        min-height: 50px;
        margin-top: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 22px;
        border-radius: 999px;
        color: #07101b;
        font-weight: 800;
        text-decoration: none;
        background: #f4f8ff;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.34);
      }

      a:focus-visible {
        outline: 3px solid #74ddff;
        outline-offset: 4px;
      }

      small {
        margin-top: 20px;
        display: block;
        color: #737b97;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path
            d="M24 6.5C16.5 14.4 12 20.2 12 27.2C12 34.4 17.4 40 24 40C30.6 40 36 34.4 36 27.2C36 20.2 31.5 14.4 24 6.5Z"
            fill="white"
            fill-opacity=".96"
          />
          <path
            d="M18 29.2C19.2 32.6 21.7 34.3 25.5 34.3"
            stroke="#3675F6"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <p class="eyebrow">PRIVATE ACCESS</p>
      <h1>Sayntra 홈페이지는<br />현재 비공개입니다.</h1>
      <p>
        허용된 소유자 계정만 홈페이지를 확인할 수 있습니다.
        아래 버튼에서 ChatGPT 계정으로 로그인해 주세요.
      </p>
      <a href="https://sayntra-local-dictation.srhmusictogether01.chatgpt.site">
        소유자 로그인
        <span aria-hidden="true">→</span>
      </a>
      <small>일반 방문자에게는 홈페이지 콘텐츠가 공개되지 않습니다.</small>
    </main>
  </body>
</html>
